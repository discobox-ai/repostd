# Every job body is one Taskfile target; what it does lives in Taskfile.yml
# and runs the same way in a terminal.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        with:
          target: verify

  check:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        with:
          target: check

  test:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/task
        with:
          target: test

  # Nix does not run on Windows, so this job gets Go from setup-go (repostd
  # ci.no-setup), with setup-go's own cache off: it is actions/cache (repostd
  # ci.no-actions-cache). Go's cache is Depot Cache, as on Linux, but Depot's
  # Windows runner carries only its credentials, not the depot CLI or
  # GOCACHEPROG: the job installs the CLI and sets GOCACHEPROG itself, only
  # for a pull request or a push to a branch. Go trusts what the cache
  # returns, and a pull request's code can write it, so any other run (a
  # release, a schedule) builds cold.
  windows:
    runs-on: depot-windows-2025-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        with:
          version: 2.102.25
      - run: go tool task test
        env:
          GOCACHEPROG: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))) && 'depot gocache' || '' }}
